<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EndoSense AI | Insights</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="phone">

    <!-- Status Bar -->
    <div class="status-bar">
        <span id="time">00:00</span>

        <div class="status-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi"></i>
            <i class="fa-solid fa-battery-full"></i>
        </div>
    </div>

    <!-- Screen -->
    <div class="screen">

        <!-- Heading -->
        <div class="text-content">
            <h1>Insights</h1>
        </div>

        <!-- Tabs -->
        <nav class="top-nav">
            <a href="trends.html" class="active">Trends</a>
            <a href="history.html">History</a>
        </nav>

        <!-- Graph Card -->
        <section class="graph-card">

            <div class="graph-header">
                <h3>Pain Level</h3>
                <span>Last 3 Cycles</span>
            </div>

            <svg
                id="trendGraph"
                class="trend-graph"
                viewBox="0 0 300 220"
                preserveAspectRatio="xMidYMid meet">

                <!-- Grid -->
                <line x1="50" y1="60" x2="270" y2="60" class="grid"/>
                <line x1="50" y1="100" x2="270" y2="100" class="grid"/>
                <line x1="50" y1="140" x2="270" y2="140" class="grid"/>

                <!-- Axes -->
                <line x1="50" y1="20" x2="50" y2="180" class="axis"/>
                <line x1="50" y1="180" x2="270" y2="180" class="axis"/>

                <!-- Y Labels -->
                <text x="4" y="24" class="axis-label">Severe</text>
                <text x="0" y="64" class="axis-label">Moderate</text>
                <text x="15" y="104" class="axis-label">Mild</text>
                <text x="12" y="184" class="axis-label">None</text>

                <!-- X Labels -->
                <text x="62" y="205" class="axis-label">Cycle 1</text>
                <text x="137" y="205" class="axis-label">Cycle 2</text>
                <text x="212" y="205" class="axis-label">Cycle 3</text>

                <!-- JavaScript inserts graph here -->
                <g id="graphData"></g>

            </svg>

        </section>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
