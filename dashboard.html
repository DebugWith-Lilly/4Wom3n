<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EndoSense AI - Home</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>


<!-- =====================================================
     PHONE
===================================================== -->

<div class="phone">


    <!-- =================================================
         STATUS BAR
    ================================================== -->

    <div class="status-bar">

        <span id="time">00:00</span>

        <div class="status-icons">

            <i class="fa-solid fa-signal"></i>

            <i class="fa-solid fa-wifi"></i>

            <i class="fa-solid fa-battery-full"></i>

        </div>

    </div>


    <!-- =================================================
         HOME SCREEN
    ================================================== -->

    <div class="screen home-screen">


        <!-- HEADER -->

        <div class="home-header">

            <button class="menu-button" type="button">
                <i class="fa-solid fa-bars"></i>
            </button>

            <button class="notification-button" type="button">
                <i class="fa-regular fa-bell"></i>
            </button>

        </div>


        <!-- GREETING -->

        <div class="greeting">

            <h1>Hi, Zanele 👋</h1>

            <p>How are you feeling today?</p>

        </div>


        <!-- =================================================
             HERO IMAGE
        ================================================== -->

        <div class="home-image">

            <img src="Dashboard_Image.png"
                 alt="EndoSense AI illustration">

        </div>


        <!-- =================================================
             TODAY'S SUMMARY
        ================================================== -->

        <section class="summary-card">

            <h2>Today's Summary</h2>


            <!-- Cycle Day -->

            <a href="calender.html"
               class="summary-row">

                <div class="summary-left">

                    <span class="summary-icon cycle-icon">
                        <i class="fa-solid fa-calendar-day"></i>
                    </span>

                    <span>Cycle Day</span>

                </div>

                <strong>Day 8</strong>

            </a>


            <!-- Next Period -->

            <a href="calender.html"
               class="summary-row">

                <div class="summary-left">

                    <span class="summary-icon period-icon">
                        <i class="fa-solid fa-droplet"></i>
                    </span>

                    <span>Next Period</span>

                </div>

                <strong>29 Aug</strong>

            </a>


            <!-- Ovulation -->

            <a href="calender.html"
               class="summary-row">

                <div class="summary-left">

                    <span class="summary-icon fertile-icon">
                        <i class="fa-solid fa-circle"></i>
                    </span>

                    <span>Predicted Ovulation</span>

                </div>

                <strong>14 Aug</strong>

            </a>


            <!-- Risk Score -->

            <a href="risk-score.html"
               class="summary-row">

                <div class="summary-left">

                    <span class="summary-icon risk-icon">
                        <i class="fa-solid fa-chart-simple"></i>
                    </span>

                    <span>Risk Score</span>

                </div>

                <strong class="risk-text">
                    Moderate
                </strong>

            </a>

        </section>


        <!-- =================================================
             QUICK ACTIONS
        ================================================== -->

        <section class="quick-actions">

            <h2>Quick Actions</h2>


            <div class="action-grid">


                <!-- Symptoms -->

                <a href="symptom-1.html"
                   class="action-card">

                    <div class="action-icon symptoms-icon">

                        <i class="fa-solid fa-person-dots-from-line"></i>

                    </div>

                    <span>Log Symptoms</span>

                </a>


                <!-- Pain Map -->

                <a href="pain map.html"
                   class="action-card">

                    <div class="action-icon pain-icon">
 
                        <i class="fa-solid fa-braille"></i>

                    </div>

                    <span>Pain Map</span>

                </a>


                <!-- Calendar -->

                <a href="calender.html"
                   class="action-card">

                    <div class="action-icon calendar-icon">

                        <i class="fa-regular fa-calendar-days"></i>

                    </div>

                    <span>View Calendar</span>

                </a>
            </div>

        </section>


    </div>

</div>


<script src="script.js"></script>

</body>

</html>
