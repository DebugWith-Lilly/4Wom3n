<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EndoSense AI | Pain Map</title>

    <!-- CSS -->
    <link rel="stylesheet" href="pain map.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="phone">

    <!-- ==========================
         STATUS BAR
    =========================== -->

    <div class="status-bar">

        <span id="time">00:00</span>

        <div class="status-icons">
            <i class="fa-solid fa-signal"></i>
            <i class="fa-solid fa-wifi"></i>
            <i class="fa-solid fa-battery-full"></i>
        </div>

    </div>

    <!-- ==========================
         SCREEN
    =========================== -->

    <div class="screen">

        <!-- Heading -->

        <div class="text-content">
            <h1>Pain Map</h1>
            <p>Tap on the areas where you feel pain</p>
        </div>

        <!-- Body Image -->

        <div class="main-image" id="bodyContainer">

            <img src="PainMap_Picture.png" alt="Pain Map">

        </div>

        <!-- Pain Legend -->

        <div class="pain-legend">

            <div class="legend-item no-pain-item">
                <span class="color no-pain"></span>
                <span>No Pain</span>
            </div>

            <div class="legend-item mild-item">
                <span class="color mild"></span>
                <span>Mild</span>
            </div>

            <div class="legend-item moderate-item">
                <span class="color moderate"></span>
                <span>Moderate</span>
            </div>

            <div class="legend-item severe-item">
                <span class="color severe"></span>
                <span>Severe</span>
            </div>

        </div>

        <!-- Save Button -->

        <button class="save-btn">
            Save Pain Map
        </button>

    </div>

</div>

<!-- JavaScript -->

<script src="pain-map.js"></script>

</body>
</html>
