<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EndoSense AI - History</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Phone -->
    <div class="phone">

        <!-- Status Bar -->
        <div class="status-bar">
            <span id="time">00:00</span>

            <div class="status-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- Screen -->
        <div class="screen">

            <!-- Heading -->
            <div class="text-content">
                <h1>Insights</h1>
            </div>

            <!-- Top Navigation -->
            <nav class="top-nav">
                <a href="history.html" class="active">History</a>
                <a href="trends.html">Trends</a>
            </nav>

            <!-- History List -->
            <div class="history-list">

                <!-- Symptom 1 -->
                <a href="symptom-1.html" class="history-link">
                    <div class="history-card">
                        <div class="history-info">
                            <h3>Symptom 1</h3>
                            <p>Today • 09:15 AM</p>
                        </div>

                        <div class="history-right">
                            <span class="severity high">High</span>
                            <i class="fa-solid fa-chevron-right"></i>
                        </div>
                    </div>
                </a>

                <!-- Symptom 2 -->
                <a href="symptom-2.html" class="history-link">
                    <div class="history-card">
                        <div class="history-info">
                            <h3>Symptom 2</h3>
                            <p>Yesterday • 08:00 PM</p>
                        </div>

                        <div class="history-right">
                            <span class="severity low">Low</span>
                            <i class="fa-solid fa-chevron-right"></i>
                        </div>
                    </div>
                </a>

                <!-- Symptom 3 -->
                <a href="symptom-3.html" class="history-link">
                    <div class="history-card">
                        <div class="history-info">
                            <h3>Symptom 3</h3>
                            <p>3 Aug 2026 • 07:45 AM</p>
                        </div>

                        <div class="history-right">
                            <span class="severity medium">Medium</span>
                            <i class="fa-solid fa-chevron-right"></i>
                        </div>
                    </div>
                </a>

                <!-- Symptom 4 -->
                <a href="symptom-4.html" class="history-link">
                    <div class="history-card">
                        <div class="history-info">
                            <h3>Symptom 4</h3>
                            <p>30 Jul 2026 • 04:20 PM</p>
                        </div>

                        <div class="history-right">
                            <span class="severity medium">Medium</span>
                            <i class="fa-solid fa-chevron-right"></i>
                        </div>
                    </div>
                </a>

                <!-- Symptom 5 -->
                <a href="symptom-5.html" class="history-link">
                    <div class="history-card">
                        <div class="history-info">
                            <h3>Symptom 5</h3>
                            <p>25 Jul 2026 • 10:30 AM</p>
                        </div>

                        <div class="history-right">
                            <span class="severity low">Completed</span>
                            <i class="fa-solid fa-chevron-right"></i>
                        </div>
                    </div>
                </a>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
